# buf 工作区配置（D-032）。模块根 = 仓库根：这样 buf 看到的文件名是 proto/v1/agent.proto，
# 与 protoc 时代生成物头部的 `// source: proto/v1/agent.proto` 署名保持一致，重新生成时
# 除了生成器版本行之外零 diff。
# excludes：仓库其余目录不是本模块的一部分，显式排除，避免 buf 误扫描（webui/node_modules 等）。
version: v2
modules:
  - path: .
    excludes:
      - agent
      - api
      - bin
      - controlplane
      - deploy
      - docs
      - pkg
      - sdk
      - tools
      - webui
lint:
  use:
    - STANDARD
  # proto 文件在 proto/v1/ 而包名是 fileagent.v1，目录不匹配是既有事实；
  # 移动文件会改变生成物的 source 署名与落点，超出契约维护范围，豁免该规则。
  # RPC_REQUEST_STANDARD_NAME：Connect 流的消息名是 AgentMessage/ServerMessage（D-032 之前
  # 就存在的契约，改名字等于改 gRPC 契约本身），豁免。
  except:
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  # proto/third_party/ 是逐字节复制的第三方契约（SeaweedFS filer.proto，D-038），
  # 不归我们改、也不过我们的 lint 规矩。豁免只作用于这个目录，proto/v1 不受影响。
  # 注意 breaking 检查**不**豁免该目录：上游协议删字段/改编号会（有意地）被
  # buf breaking 拦下来提醒适配器核对，见 proto/third_party/seaweedfs/README.md。
  ignore:
    - proto/third_party
breaking:
  # 契约规矩「只增字段，不改字段编号，不删除字段」由 CI 的 buf breaking（对 master 比对）机器强制。
  use:
    - FILE