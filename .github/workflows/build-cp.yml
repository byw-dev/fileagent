name: Build — Control Plane

on:
  workflow_dispatch:

jobs:
  build:
    name: Linux amd64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum

      - name: Build
        run: |
          mkdir -p bin
          cd controlplane && go build -o ../bin/controlplane ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: controlplane-linux-amd64
          path: bin/controlplane
          retention-days: 30
