name: CI — Agent

# PR / push correctness gate for the Agent: build + vet + test across
# ubuntu-latest and windows-latest. This is the module's regression net —
# it does NOT run integration tests (needs a real MinIO / TLS endpoint,
# so `-tags=integration` is deliberately omitted, same as ci-cp.yml).
# The cross-platform matrix is the point: agent targets Windows/Linux
# (see build-agent.yml) but had only ever been verified on macOS locally.
# Release-artifact builds stay in build-agent.yml (manual workflow_dispatch).

on:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/ci-agent.yml'
  push:
    branches: [master]
    paths:
      - 'agent/**'
      - '.github/workflows/ci-agent.yml'

jobs:
  test:
    name: build + vet + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # mattn/go-sqlite3 needs CGO. On windows-latest, GCC is provided by the
      # pre-installed MSYS2 (mingw64). We just need to put it on PATH.
      # (Same treatment as build-agent.yml.)
      - name: Add GCC to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Agent is an independent Go module; pin to the version it declares
      # (do NOT use tools/go.mod — that newer Go is only required by sqlc).
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: build
        working-directory: agent
        run: go build ./...

      - name: vet
        working-directory: agent
        run: go vet ./...

      - name: test
        working-directory: agent
        run: go test ./... -count=1

      # IC-BUG-44: real kernel-queue overflow test. The inotify backend is the
      # production backend (and the only one that reliably reports
      # ErrEventOverflow), so this runs on Linux only. The file is
      # double-gated (//go:build linux && overflow + env var); the sysctl
      # makes the 20k-file burst actually overflow the kernel queue (some CI
      # images raise the default), and the greps turn a silently-skipped or
      # not-really-overflowing run into a hard failure.
      - name: test (real inotify overflow — Linux only)
        if: runner.os == 'Linux'
        working-directory: agent
        run: |
          sudo sysctl -w fs.inotify.max_queued_events=4096
          go test -tags overflow -run TestInotifyOverflow_SafetyNetRescan_RecoversLostFiles -v -count=1 -timeout 10m ./internal/watcher 2>&1 | tee overflow-test.log
          grep -q "gate open" overflow-test.log || { echo "::error::overflow test was skipped (gate closed) — not allowed to pass silently"; exit 1; }
          grep -q "overflow is guaranteed" overflow-test.log || { echo "::error::kernel queue was not small enough to overflow — safety-net path not exercised"; exit 1; }
          grep -q "^--- PASS" overflow-test.log || { echo "::error::overflow test did not pass"; exit 1; }
        env:
          # The test file double-gates on the build tag AND this env var; the
          # greps above fail the step if the test silently skipped.
          FILEAGENT_TEST_INOTIFY_OVERFLOW: "1"

      # Same recovery chain as the step above, but on the DEFAULT production
      # mode (append_mode=overwrite → the debounced loop). The tail-mode test
      # exercises loopFsnotify, which is fail-closed blocked in production
      # (IC-BUG-46) — without this step the overflow → safetyNetRescan chain
      # (including the rescan's hot-file skip + debounce-recheck re-arm) has
      # no end-to-end coverage on a mode any production watcher actually
      # walks. Same double gate + greps: a silently skipped or
      # not-really-overflowing run must fail the step, not pass it.
      - name: test (real inotify overflow — debounced mode, Linux only)
        if: runner.os == 'Linux'
        working-directory: agent
        run: |
          sudo sysctl -w fs.inotify.max_queued_events=4096
          go test -tags overflow -run TestInotifyOverflow_Debounced_SafetyNetRescan_RecoversLostFiles -v -count=1 -timeout 10m ./internal/watcher 2>&1 | tee overflow-debounced-test.log
          grep -q "gate open" overflow-debounced-test.log || { echo "::error::debounced overflow test was skipped (gate closed) — not allowed to pass silently"; exit 1; }
          grep -q "overflow is guaranteed" overflow-debounced-test.log || { echo "::error::kernel queue was not small enough to overflow — safety-net path not exercised"; exit 1; }
          grep -q "^--- PASS" overflow-debounced-test.log || { echo "::error::debounced overflow test did not pass"; exit 1; }
        env:
          FILEAGENT_TEST_INOTIFY_OVERFLOW: "1"
