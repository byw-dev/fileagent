name: CI — Control Plane

# PR / push correctness gate for the Control Plane: verifies generated code is
# in sync with its sources (sqlc drift guard) and that CP builds/tests pass.
# Release-artifact builds stay in build-cp.yml (manual workflow_dispatch).

on:
  pull_request:
    paths:
      - 'controlplane/**'
      - 'pkg/**'
      - 'api/**'
      - 'tools/**'
      - 'Makefile'
      - 'go.work'
      - 'go.work.sum'
      - 'deploy/docker-compose.test.yml'
      - 'scripts/ci/**'
      - 'ci/**'
      - '.github/workflows/ci-cp.yml'
  push:
    branches: [master]
    paths:
      - 'controlplane/**'
      - 'pkg/**'
      - 'api/**'
      - 'tools/**'
      - 'Makefile'
      - 'go.work'
      - 'go.work.sum'
      - 'deploy/docker-compose.test.yml'
      - 'scripts/ci/**'
      - 'ci/**'
      - '.github/workflows/ci-cp.yml'

concurrency:
  group: ci-cp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: codegen-drift + vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TEST_DATABASE_URL: postgres://fileagent:fileagent@localhost:5432/fileagent_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      # The codegen tools live in tools/go.mod (which requires the newest Go);
      # using its version also satisfies the older controlplane module.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            tools/go.sum
            controlplane/go.sum

      # Regenerate with the version pinned in tools/ and fail if anything drifts
      # from the committed generated code. Uses `make generate` so local and CI
      # run the identical command.
      - name: sqlc drift guard
        run: |
          make generate
          # git status --porcelain catches modified AND new/untracked/deleted
          # files (git diff --exit-code misses untracked), so a newly-generated
          # output can't slip through.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is out of sync with its sources. Run 'make generate' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

      - name: start PostgreSQL
        run: docker compose -f deploy/docker-compose.test.yml up -d --wait postgres

      - name: vet + integration test gate
        run: make test-gate-controlplane

      - name: dump PostgreSQL logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.test.yml logs postgres

      - name: upload Control Plane gate artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: controlplane-gate-output
          path: .ci-out/
          if-no-files-found: ignore
