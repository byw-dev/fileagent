name: CI — Proto

# PR / push correctness gate for the proto contract (proto/v1/agent.proto), which is
# shared by controlplane and agent (see DECISIONS.md D-032). Three checks:
#   1. drift guard: regenerating with the versions pinned in tools/ must reproduce the
#      committed api/v1/*.pb.go byte-for-byte. This doubles as the cross-platform check:
#      committed files were generated on macOS, so a green job proves the ubuntu output
#      is byte-identical.
#   2. buf lint.
#   3. buf breaking — machine-enforces the contract rule "only add fields, never
#      renumber or delete fields" (previously human-enforced only). Baseline depends
#      on the event: pull_request compares against the PR's base branch tip
#      (origin/<base>), push compares against the pre-push commit
#      (github.event.before) — comparing a push against master's tip would compare
#      the just-pushed commit with itself. A push whose before is all zeros (branch
#      just created) or missing locally skips breaking with a printed reason.
# Also covers the vendored SeaweedFS filer.proto (D-038): its generated code lives
# in controlplane/internal/storage/seaweedfs/filerpb/ (not api/), so that path is
# listed here too — direct edits there trigger the drift guard.
# proto affects both controlplane and agent, and ci-cp.yml's paths don't include
# proto/**, so this is a separate workflow.

on:
  pull_request:
    paths:
      - 'proto/**'
      - 'api/**'
      - 'controlplane/internal/storage/seaweedfs/filerpb/**'
      - 'tools/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'Makefile'
      - '.github/workflows/ci-proto.yml'
  push:
    branches: [master]
    paths:
      - 'proto/**'
      - 'api/**'
      - 'controlplane/internal/storage/seaweedfs/filerpb/**'
      - 'tools/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'Makefile'
      - '.github/workflows/ci-proto.yml'

jobs:
  check:
    name: proto-drift + buf lint + buf breaking
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking reads the baseline from git history (the PR base branch's
          # remote ref, or the push event's before commit); full history needed.
          fetch-depth: 0

      # The codegen tools live in tools/go.mod (which requires the newest Go);
      # using its version also satisfies the older controlplane module.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            tools/go.sum
            controlplane/go.sum

      # Regenerate with the versions pinned in tools/ and fail if anything drifts
      # from the committed generated code. Same command local and CI run (make).
      - name: proto drift guard
        run: |
          make generate-proto
          # git status --porcelain catches modified AND new/untracked/deleted
          # files (git diff --exit-code misses untracked), so a newly-generated
          # output can't slip through.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated proto code is out of sync with its sources. Run 'make generate-proto' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

      # buf runs from the repo root (its module root): buf.yaml / buf.gen.yaml / .git
      # are all resolved relative to cwd, while `go -C tools tool buf` executes with
      # cwd=tools/ — so build the pinned buf binary into a scratch dir and run it here.
      #
      # The breaking baseline differs by event; the ${{ }} expressions are injected
      # via env: so the run script itself is expression-free and can be extracted and
      # replayed locally for testing:
      #   pull_request -> refs/remotes/origin/<base branch> (what the PR changes).
      #   push         -> the pre-push commit (github.event.before).
      # The old approach ran `git branch --force master origin/master` first, which
      # hard-fails every push run with exit 128: a push checkout has master checked
      # out, and git refuses to force-update the branch used by a worktree. It also
      # made push runs compare master's tip with itself (an empty check). buf's
      # '.git#ref=<sha|refs/remotes/...>' input needs no ref juggling at all
      # (verified against the buf version pinned in tools/go.mod, v1.72.0).
      - name: buf lint + buf breaking (vs PR base / pre-push commit)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          rm -rf .tmp-proto-tools
          GOWORK=off go -C tools build -o ../.tmp-proto-tools/ github.com/bufbuild/buf/cmd/buf
          PATH=$PWD/.tmp-proto-tools:$PATH .tmp-proto-tools/buf lint

          # Resolve the breaking baseline. An empty BASELINE_REF means "skip with a
          # printed reason" — never silently, and never by comparing a commit with
          # itself (which would fake green).
          BASELINE_REF=""
          SKIP_REASON=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE_REF="refs/remotes/origin/${BASE_REF:-master}"
          else
            ZERO_SHA=0000000000000000000000000000000000000000
            if [ -z "$BEFORE_SHA" ]; then
              SKIP_REASON="push event carries no BEFORE_SHA"
            elif [ "$BEFORE_SHA" = "$ZERO_SHA" ]; then
              SKIP_REASON="before is all zeros (branch was just created) — no prior commit to compare against"
            elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              SKIP_REASON="before commit $BEFORE_SHA is not present locally (history rewritten?)"
            else
              BASELINE_REF="$BEFORE_SHA"
            fi
          fi

          if [ -n "$SKIP_REASON" ]; then
            echo "::warning::buf breaking skipped: $SKIP_REASON"
          else
            echo "buf breaking against $BASELINE_REF"
            PATH=$PWD/.tmp-proto-tools:$PATH .tmp-proto-tools/buf breaking --against ".git#ref=$BASELINE_REF"
          fi
          rm -rf .tmp-proto-tools