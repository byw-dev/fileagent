[tool.poetry]
name = "fileagent-sdk"
version = "0.1.0"
description = "Python SDK for the FileAgent file collection and distribution platform"
authors = ["FileAgent Team"]
readme = "README.md"
packages = [{ include = "fileagent" }]

[tool.poetry.dependencies]
python = "^3.10"
httpx = ">=0.27.0"
typing-extensions = ">=4.0.0"

[tool.poetry.group.dev.dependencies]
respx = ">=0.21.0"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
