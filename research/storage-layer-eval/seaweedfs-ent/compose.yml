# Storage-eval candidate: SeaweedFS ENTERPRISE (same config as CE) single-node (master+volume+filer+s3 in one process).
name: se-seaweed-ent
services:
  seaweed:
    image: chrislusf/seaweedfs-enterprise@sha256:9eb82b98aa44e9f5d050fbbaa7078a98408d4198e1fbc430e9c02dd21a55d93a
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/sw/s3.json
      -s3.iam.config=/etc/sw/iam.json -s3.iam.readOnly=false
    ports: ["19300:8333"]
    volumes:
      - data:/data
      - ../seaweedfs/s3.json:/etc/sw/s3.json:ro
      - ../seaweedfs/iam.json:/etc/sw/iam.json:ro
      - ../seaweedfs/notification.toml:/etc/seaweedfs/notification.toml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes: {data: {}}
