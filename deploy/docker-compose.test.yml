# Integration test environment — ephemeral volumes, torn down after test runs
# Usage:
#   docker compose -f deploy/docker-compose.test.yml up -d
#   # run tests ...
#   docker compose -f deploy/docker-compose.test.yml down -v

services:
  postgres:
    image: postgres:15-alpine
    container_name: fileagent-test-postgres
    environment:
      POSTGRES_USER: fileagent
      POSTGRES_PASSWORD: fileagent
      POSTGRES_DB: fileagent_test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileagent -d fileagent_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: fileagent-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  minio:
    # ⚠️ 镜像来自**我们自己的私有镜像仓**，不是任何上游 registry（D-036）。
    # MinIO 已转向商用：Docker Hub 上的 minio/minio、minio/mc 与 dl.min.io 的 mc
    # 下载在 2026 年被移除，`quay.io/minio/minio` 此后也不再公开可读
    # （匿名 token 能签发，但 manifest 返回 401），`ghcr.io/minio/minio` 返回 403。
    # 也就是说**已经没有任何公共通路**能拉到这个镜像；有本地缓存的机器察觉不到，
    # 任何全新环境或 CI runner 都会直接起不来（这正是 CI 实测撞到的）。
    #
    # 因此这里钉的是 **digest 而不是 tag**：镜像仓是我们自己的，tag 可被重写，
    # digest 不可以。这个 digest 是一个**多架构 manifest list**（linux/amd64 +
    # linux/arm64），所以 dev 用的 Apple Silicon 与 CI 用的 x86-64 runner
    # 都能各自拉到正确的那一份。
    #
    # 版本同时钉死：镜像内自带 mc（healthcheck 与 init-minio.sh 都依赖它），
    # 新版已把 mc 拆走——而现在**也没有新版可升**，见 D-036。
    #
    # ⚠️ 这是**私有** package：全新环境需要先 `docker login ghcr.io`；
    # 离线 / 客户现场用 `docker load` 导入交付的 tarball，见 docs/ops/deployment.md。
    image: ghcr.io/byw-dev/minio@sha256:90677cc242e4b08afa68d7503c5880a1feb19cd0a1e0ce4702e06b2426e203ad
    container_name: fileagent-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    tmpfs:
      - /data
    # IC-4a ③ note (updated by the PR #110 review, S3): /data is a tmpfs here
    # BY DESIGN — this compose is a FUNCTIONAL-ONLY test environment; it does
    # NOT exercise webhook-queue persistence, and there is no override that
    # could (any in-container path on tmpfs dies with the container, and
    # init-minio.sh rejects /tmp/* queue dirs on purpose). The persistence
    # guarantee (undelivered events survive a MinIO container restart) is
    # verified live against the dev environment (docker-compose.dev.yml,
    # minio_data named volume) — see the IC-4a acceptance record. If an
    # automated persistence regression is ever wanted, add a named-volume
    # profile here, not a tmpfs path override.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nats:
    image: nats:2-alpine
    container_name: fileagent-test-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
