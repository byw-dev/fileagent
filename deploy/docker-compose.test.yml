# Integration test environment — ephemeral volumes, torn down after test runs
# Usage:
#   docker compose -f deploy/docker-compose.test.yml up -d
#   # run tests ...
#   docker compose -f deploy/docker-compose.test.yml down -v

services:
  postgres:
    image: postgres:15-alpine
    container_name: fileagent-test-postgres
    environment:
      POSTGRES_USER: fileagent
      POSTGRES_PASSWORD: fileagent
      POSTGRES_DB: fileagent_test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileagent -d fileagent_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: fileagent-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  minio:
    # ⚠️ registry 必须是 quay.io，不是 Docker Hub：MinIO 已转向商用，2026 年彻底
    # 移除了 Docker Hub 上的 minio/minio、minio/mc 镜像以及 dl.min.io 的 mc 下载，
    # 实测 `docker manifest inspect minio/minio:*` 一律
    # 「repository does not exist」（而 postgres/redis/nats 均正常）。
    # 有本地缓存的机器察觉不到，任何全新环境或 CI runner 会直接起不来。
    # 版本同时钉死：镜像内自带 mc（healthcheck 与 init-minio.sh 都依赖它），
    # 新版已把 mc 拆走。
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fileagent-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    tmpfs:
      - /data
    # IC-4a ③ note (updated by the PR #110 review, S3): /data is a tmpfs here
    # BY DESIGN — this compose is a FUNCTIONAL-ONLY test environment; it does
    # NOT exercise webhook-queue persistence, and there is no override that
    # could (any in-container path on tmpfs dies with the container, and
    # init-minio.sh rejects /tmp/* queue dirs on purpose). The persistence
    # guarantee (undelivered events survive a MinIO container restart) is
    # verified live against the dev environment (docker-compose.dev.yml,
    # minio_data named volume) — see the IC-4a acceptance record. If an
    # automated persistence regression is ever wanted, add a named-volume
    # profile here, not a tmpfs path override.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nats:
    image: nats:2-alpine
    container_name: fileagent-test-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
