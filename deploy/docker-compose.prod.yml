# All-in-one production-style deployment (single-node), realizing system-design
# §10.1. Brings up the full stack: PostgreSQL, Redis, NATS (JetStream), MinIO,
# the single-binary Control Plane (Web UI embedded) and a Caddy TLS gateway.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Then initialize MinIO once (buckets + webhook), see docs/ops/deployment.md:
#   MINIO_ENDPOINT=http://localhost:9000 bash deploy/scripts/init-minio.sh
#
# Override secrets/passwords via a .env file next to this compose (or the shell
# environment). Defaults are DEV-GRADE and MUST be changed for real production.

services:
  postgres:
    image: postgres:15-alpine
    container_name: fileagent-postgres
    environment:
      POSTGRES_USER: fileagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fileagent}
      POSTGRES_DB: fileagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileagent -d fileagent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fileagent-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    container_name: fileagent-nats
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fileagent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Object storage must be reachable by browsers (presigned download/upload
      # go direct to MinIO) and the console for administration.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  controlplane:
    build:
      context: ..
      dockerfile: controlplane/Dockerfile
    image: fileagent/controlplane:latest
    container_name: fileagent-controlplane
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Connections use in-network service names, not localhost.
      DATABASE_URL: postgres://fileagent:${POSTGRES_PASSWORD:-fileagent}@postgres:5432/fileagent?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      # For the all-in-one PoC the CP uses the MinIO root credentials to mint STS
      # tokens. In production create a scoped service account instead.
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_dev_only_jwt_secret}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-changeme}
      # Empty password → CP generates a random one and writes it to the file
      # below. Set BOOTSTRAP_ADMIN_PASSWORD to pin a known first-admin password.
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_CREDENTIALS_FILE: /data/bootstrap_admin_credentials.txt
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Persists the generated bootstrap admin credentials across restarts.
      - controlplane_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: fileagent-caddy
    depends_on:
      - controlplane
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  controlplane_data:
  caddy_data:
  caddy_config:
