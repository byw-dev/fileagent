# All-in-one single-node stack, realizing system-design §10.1: PostgreSQL,
# Redis, NATS (JetStream), MinIO, the single-binary Control Plane (Web UI
# embedded) and a Caddy TLS gateway.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Then initialize MinIO once (buckets + webhook), see docs/ops/deployment.md:
#   MINIO_ENDPOINT=http://localhost:9000 bash deploy/scripts/init-minio.sh
#
# ⚠️ THIS IS A DEV / PoC ALL-IN-ONE, not a hardened production topology:
#   - default passwords, and MinIO is published straight to the host for
#     convenience (below). A production deployment should front MinIO through the
#     gateway (Caddy, see system-design §10.4) and split the CP↔MinIO (internal)
#     endpoint from the client-facing (public) one so CP traffic stays on the
#     internal network — tracked as a follow-up (docs/tasks/backlog.md).
# Override secrets/passwords via a .env file next to this compose (or the shell
# environment). Defaults are DEV-GRADE and MUST be changed for real production.

services:
  postgres:
    image: postgres:15-alpine
    container_name: fileagent-postgres
    environment:
      POSTGRES_USER: fileagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fileagent}
      POSTGRES_DB: fileagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileagent -d fileagent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fileagent-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    container_name: fileagent-nats
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    # Pinned (not :latest) on purpose: the healthcheck below runs `mc`, which
    # this release still bundles in the server image. Newer minio/minio images
    # no longer ship `mc` (it moved to the separate minio/mc image), so a `latest`
    # pull could silently break the healthcheck. If you bump this, switch the
    # healthcheck to a minio/mc sidecar or an mc-free probe.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fileagent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # DEV/PoC: MinIO is published straight to the host so browsers/agents can
      # reach it via MINIO_PUBLIC_ENDPOINT for direct presigned upload/download.
      # The CP itself no longer uses this host path — it dials minio:9000 on the
      # docker network (see MINIO_ENDPOINT / D-024). Production should front MinIO
      # through a TLS gateway (gateway-agnostic) and set MINIO_PUBLIC_ENDPOINT to
      # that address instead of publishing MinIO on the host directly.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  controlplane:
    build:
      context: ..
      dockerfile: controlplane/Dockerfile
    image: fileagent/controlplane:latest
    container_name: fileagent-controlplane
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Connections use in-network service names, not localhost.
      DATABASE_URL: postgres://fileagent:${POSTGRES_PASSWORD:-fileagent}@postgres:5432/fileagent?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      # Split endpoints (D-024): the CP dials MINIO_ENDPOINT for its own calls
      # (STS AssumeRole + bucket admin) — keep it on the in-network service name
      # so CP↔MinIO stays on the docker network (no host hairpin).
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      # MINIO_PUBLIC_ENDPOINT is the client-facing host: it is returned to agents
      # in the STS payload and is the host presigned download URLs are signed for
      # (see internal/storage/sts.go and handler/files.go). It must be reachable
      # by browsers AND agents, so it can't be the in-network "minio:9000". On a
      # single host set it to the host's LAN IP (MinIO is published on :9000
      # above). In production, front MinIO through your TLS gateway and point
      # this at that address (gateway-agnostic; see docs/ops/deployment.md) —
      # then set MINIO_PUBLIC_USE_SSL=true so signed URLs use https.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set to a host:port reachable by browsers/agents, e.g. the host LAN IP 192.168.1.10:9000}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      # init-minio.sh creates this real IAM user with the minimum policy needed
      # for AssumeRole, presigned GETs, runtime bucket creation, and delegation
      # of the agent's write-only session policy. Service accounts cannot call
      # AssumeRole; do not point these variables back at a root svcacct.
      MINIO_ACCESS_KEY: ${CP_ADMIN_ACCESS_KEY:-cpAdminIAM000000000}
      MINIO_SECRET_KEY: ${CP_ADMIN_SECRET_KEY:-cpAdminSecret00000000}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_dev_only_jwt_secret}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-changeme}
      # Empty password → CP generates a random one and writes it to the file
      # below. Set BOOTSTRAP_ADMIN_PASSWORD to pin a known first-admin password.
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_CREDENTIALS_FILE: /data/bootstrap_admin_credentials.txt
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Persists the generated bootstrap admin credentials across restarts.
      - controlplane_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: fileagent-caddy
    depends_on:
      - controlplane
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  controlplane_data:
  caddy_data:
  caddy_config:
