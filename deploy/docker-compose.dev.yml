# Local development environment
# Usage: docker compose -f deploy/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: ${FA_CONTAINER_PREFIX:-fileagent-dev}-postgres
    environment:
      POSTGRES_USER: fileagent
      POSTGRES_PASSWORD: fileagent
      POSTGRES_DB: fileagent
    ports:
      - "${FA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileagent -d fileagent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${FA_CONTAINER_PREFIX:-fileagent-dev}-redis
    ports:
      - "${FA_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    # ⚠️ 镜像来自**我们自己的私有镜像仓**，不是任何上游 registry（D-036）。
    # MinIO 已转向商用：Docker Hub 上的 minio/minio、minio/mc 与 dl.min.io 的 mc
    # 下载在 2026 年被移除，`quay.io/minio/minio` 此后也不再公开可读
    # （匿名 token 能签发，但 manifest 返回 401），`ghcr.io/minio/minio` 返回 403。
    # 也就是说**已经没有任何公共通路**能拉到这个镜像；有本地缓存的机器察觉不到，
    # 任何全新环境或 CI runner 都会直接起不来（这正是 CI 实测撞到的）。
    #
    # 因此这里钉的是 **digest 而不是 tag**：镜像仓是我们自己的，tag 可被重写，
    # digest 不可以。这个 digest 是一个**多架构 manifest list**（linux/amd64 +
    # linux/arm64），所以 dev 用的 Apple Silicon 与 CI 用的 x86-64 runner
    # 都能各自拉到正确的那一份。
    #
    # 版本同时钉死：镜像内自带 mc（healthcheck 与 init-minio.sh 都依赖它），
    # 新版已把 mc 拆走——而现在**也没有新版可升**，见 D-036。
    #
    # ⚠️ 这是**私有** package：全新环境需要先 `docker login ghcr.io`；
    # 离线 / 客户现场用 `docker load` 导入交付的 tarball，见 docs/ops/deployment.md。
    image: ghcr.io/byw-dev/minio@sha256:90677cc242e4b08afa68d7503c5880a1feb19cd0a1e0ce4702e06b2426e203ad
    container_name: ${FA_CONTAINER_PREFIX:-fileagent-dev}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${FA_MINIO_PORT:-9000}:9000"
      - "${FA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
      # IC-4a ③ (IC-BUG-9): the webhook delivery queue must live on a
      # persistent volume. init-minio.sh points queue_dir at
      # /data/minio-webhook-queue (inside the minio_data volume), so undelivered
      # events survive both `docker restart` and `docker compose down/up` with
      # a named volume. Previously the queue sat in /tmp and was wiped — or,
      # drifted, empty (sendSync drops failed deliveries outright).
    # MinIO 需要主动回连跑在宿主上的 Control Plane（notify_webhook）。
    # Docker Desktop 自带 host.docker.internal，但 Linux 的 Docker Engine 没有——
    # GitHub Actions 的 ubuntu runner 正是后者。host-gateway 在两边都成立，
    # 所以这一行让同一份配置在本地与 CI 上行为一致。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    container_name: ${FA_CONTAINER_PREFIX:-fileagent-dev}-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "${FA_NATS_PORT:-4222}:4222"
      - "${FA_NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
