# Local development environment
# Usage: docker compose -f deploy/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: fileagent-dev-postgres
    environment:
      POSTGRES_USER: fileagent
      POSTGRES_PASSWORD: fileagent
      POSTGRES_DB: fileagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileagent -d fileagent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fileagent-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fileagent-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      # IC-4a ③ (IC-BUG-9): the webhook delivery queue must live on a
      # persistent volume. init-minio.sh points queue_dir at
      # /data/minio-webhook-queue (inside the minio_data volume), so undelivered
      # events survive both `docker restart` and `docker compose down/up` with
      # a named volume. Previously the queue sat in /tmp and was wiped — or,
      # drifted, empty (sendSync drops failed deliveries outright).
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    container_name: fileagent-dev-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
