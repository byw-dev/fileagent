syntax = "proto3";
package fileagent.v1;
option go_package = "github.com/byw-dev/fileagent/api/v1;agentv1";

import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────
// 服务定义
// ─────────────────────────────────────────────

service AgentService {
  // Agent 主连接：建立后服务端持续推送指令，Agent 持续上报事件
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  // 注册申请（无需 token，TLS 即可）
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 轮询审批结果（PENDING 阶段使用）
  rpc PollApproval(PollApprovalRequest) returns (PollApprovalResponse);
  // 主动续期 STS 凭据
  rpc RefreshCredentials(RefreshCredentialsRequest) returns (RefreshCredentialsResponse);
}

// ─────────────────────────────────────────────
// Agent → Server 消息（Connect 流上行）
// ─────────────────────────────────────────────

message AgentMessage {
  string message_id = 1;
  oneof payload {
    Heartbeat         heartbeat          = 10;
    UploadResult      upload_result      = 11;
    DirectoryListing  directory_listing  = 12;
    RuleStatusReport  rule_status        = 13;
    ErrorReport       error_report       = 14;
    DryRunResult      dry_run_result     = 15;
  }
}

message Heartbeat {
  string  agent_id        = 1;
  int64   uptime_seconds  = 2;
  int32   queue_depth     = 3;
  float   upload_bps      = 4;
  string  version         = 5;
  repeated DiskInfo disks = 6;
}

message DiskInfo {
  string path        = 1;
  uint64 total_bytes = 2;
  uint64 free_bytes  = 3;
  string fs_type     = 4;
}

message UploadResult {
  string  rule_id       = 1;
  string  local_path    = 2;
  string  storage_path  = 3;
  string  bucket        = 4;
  int64   size_bytes    = 5;
  string  sha256        = 6;
  string  etag          = 7;
  bool    success       = 8;
  string  error_message = 9;
  google.protobuf.Timestamp file_mtime   = 10;
  google.protobuf.Timestamp uploaded_at  = 11;
  int32   retry_count   = 12;
  string  task_id       = 13; // Persistent upload task, echoed by Acknowledgement.
}

message DirectoryListing {
  string          request_id = 1;
  string          path       = 2;
  repeated FsEntry entries   = 3;
  string          error      = 4;
}

message FsEntry {
  string name       = 1;
  bool   is_dir     = 2;
  int64  size_bytes = 3;
  google.protobuf.Timestamp modified_at = 4;
  string permissions = 5;
}

message RuleStatusReport {
  string rule_id    = 1;
  string status     = 2;
  string error_msg  = 3;
  int64  files_processed = 4;
  int64  bytes_uploaded  = 5;
}

message ErrorReport {
  string code     = 1;
  string message  = 2;
  string detail   = 3;
}

message DryRunResult {
  string rule_id                   = 1;
  repeated DryRunFileResult files  = 2;
  string error                     = 3;
}

message DryRunFileResult {
  string local_path                 = 1;
  string upload_path                = 2;
  map<string, string> parsed_fields = 3;
  string compose_error              = 4;
}

// ─────────────────────────────────────────────
// Server → Agent 消息（Connect 流下行）
// ─────────────────────────────────────────────

message ServerMessage {
  string message_id = 1;
  oneof payload {
    PingCommand          ping               = 10;
    ListDirectoryCommand list_directory     = 11;
    PushRuleCommand      push_rule          = 12;
    CancelRuleCommand    cancel_rule        = 13;
    CredentialsPayload   credentials        = 14;
    RevokeCommand        revoke             = 15;
    Acknowledgement      ack                = 16;
  }
}

message PingCommand {}

message ListDirectoryCommand {
  string request_id = 1;
  string path       = 2;
  bool   recursive  = 3;
  int32  max_depth  = 4;
}

message PushRuleCommand {
  CollectionRule rule = 1;
}

message CollectionRule {
  string rule_id            = 1;
  string name               = 2;
  string mode               = 3;
  string base_path          = 4;
  string path_pattern       = 5;
  string dest_path_template = 6;
  string upload_bucket      = 7;
  bool   recursive          = 8;
  string cron_expr          = 9;
  bool   run_once_on_start  = 10;
  string append_mode        = 11;
  bool   enabled            = 12;
  bool   dry_run            = 13;
}

message CancelRuleCommand {
  string rule_id = 1;
}

message CredentialsPayload {
  string access_key    = 1;
  string secret_key    = 2;
  string session_token = 3;
  string endpoint      = 4;
  bool   use_ssl       = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message RevokeCommand {
  string reason = 1;
}

message Acknowledgement {
  string ref_message_id = 1;
  bool   success        = 2;
  string error          = 3;
}

// ─────────────────────────────────────────────
// 注册 / 审批轮询
// ─────────────────────────────────────────────

message RegisterRequest {
  string fingerprint   = 1;
  string hostname      = 2;
  string os_type       = 3;
  string os_version    = 4;
  string arch          = 5;
  string agent_version = 6;
  string ip_address    = 7;
}

message RegisterResponse {
  string agent_id   = 1;
  string status     = 2;
  string auth_token = 3;
  string message    = 4;
  string agent_name = 5;
}

message PollApprovalRequest {
  string agent_id    = 1;
  string fingerprint = 2;
}

message PollApprovalResponse {
  string status     = 1;
  string auth_token = 2;
  string message    = 3;
  string agent_name = 4;
}

message RefreshCredentialsRequest {
  string agent_id = 1;
  string rule_id  = 2;
}

message RefreshCredentialsResponse {
  CredentialsPayload credentials = 1;
}
