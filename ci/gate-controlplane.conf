# Policy for scripts/ci/test-gate.sh. Renaming a required test requires
# editing this file; that friction is intentional so CI cannot silently lose it.

TEST_DATABASE_URL_DEFAULT='postgres://fileagent:fileagent@localhost:5432/fileagent_test?sslmode=disable'
SETUP_TEST='TestMigrate_IdempotentOnCleanDB'

REQUIRED_PASS='
TestBatchTagQueries_Integration
TestDeadLetterUpsertMutation
TestMigrate_IdempotentOnCleanDB
TestNew_ConnectsSuccessfully
TestObservationMutationMatrix
TestQueriesRoundtrip_Agent
TestLogin_Integration_IncludesUserPayload
TestMe_Integration_ReturnsIDField
TestRefresh_Integration_BodyContractAndRotation
TestCounterSeries_MonotonicAcrossRedisLoss
TestFailCount_CacheMissFallsThroughToPG
TestRED_B1_EpochsAddNotMax
TestRunStaleCounterCleanup_RunsAndStops
TestS1_StaleCounterCleanup
TestControlPlaneAgent_EndToEnd_Integration
'

REQUIRED_LOG='MUTATION | A1 | A2 | A3prime | P2 | A4b | LPAD'
REQUIRED_LOG_COUNT=8

# Each entry is: test name | why it skips | condition that restores live coverage.
ALLOWED_SKIP='
TestIC2BLive|Requires the live MinIO and CP environment for IC-2b.|Run with the live IC-2b environment and its documented credentials/configuration.
TestIC3MultipartResumeLive|Requires a live MinIO multipart environment.|Run with the live multipart test environment and its documented credentials/configuration.
TestUploadMainPathLive|Requires the complete live Agent-to-MinIO upload path.|Run with the live upload test environment and its documented credentials/configuration.
TestIssueCredentials_Integration|Requires a live MinIO STS implementation.|Set STS_LIVE=1 when the D-036 test object store with STS is available.
TestIssueCredentials_ScopingDeniesOtherBuckets|Requires a live MinIO STS implementation.|Set STS_LIVE=1 when the D-036 test object store with STS is available.
'
